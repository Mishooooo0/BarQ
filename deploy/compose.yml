# Ring server deployment: ~/barq/compose.yml with the source in ~/barq/app (see deploy/deploy.sh).
# Bound to localhost like the other apps on the server; publish it through the Cloudflare tunnel to make it public.
# Put CLAUDE_DEV_KEY=... in ~/barq/.env (mode 600) to connect the AI Analyst.
services:
  barq:
    build: ./app
    image: barq:latest
    container_name: barq
    restart: unless-stopped
    ports:
      - "127.0.0.1:5352:5352"
    environment:
      CLAUDE_DEV_KEY: ${CLAUDE_DEV_KEY:-}
    volumes:
      - barq-data:/app/data/db

volumes:
  barq-data:
